<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>San Veridia Vice - Open World Crime</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="800"></canvas>
    
    <div id="ui-layer">
      <div class="hud-bars">
        <div class="bar-container">
          <div id="health-fill" class="bar-fill"></div>
          <div class="bar-label">HEALTH</div>
        </div>
        <div class="bar-container">
          <div id="stamina-fill" class="bar-fill"></div>
          <div class="bar-label">STAMINA</div>
        </div>
      </div>

      <div class="hud-top">
        <div id="money-display">$0</div>
        <div id="wanted-stars"></div>
      </div>

      <div id="mission-box" class="hidden">
        <div id="mission-title">MISSION ACTIVE</div>
        <div id="mission-desc">Objective instructions here.</div>
      </div>

      <div id="minimap-wrapper">
        <canvas id="minimap-canvas" width="180" height="180"></canvas>
      </div>
    </div>

    <div id="screen-overlay">
      <h1 class="screen-title" id="screen-title-text">San Veridia Vice</h1>
      <p class="screen-subtitle" id="screen-subtitle-text">Sun-Soaked Coastal Crime & Action</p>
      
      <div class="controls-box">
        <h3>Game Controls</h3>
        <div class="controls-grid">
          <div><b>WASD / Arrows:</b> Move / Drive</div>
          <div><b>E:</b> Enter / Exit Car</div>
          <div><b>Shift:</b> Sprint (on foot)</div>
          <div><b>Space:</b> Handbrake (in car)</div>
          <div><b>P / Esc:</b> Pause Game</div>
          <div><b>M:</b> Mute Audio</div>
        </div>
      </div>

      <button class="btn" id="action-btn">START GAME</button>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/city.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/people.js"></script>
  <script src="js/police.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
